name: "office_mail_benchmark"

emails:
  - id: "mail01"
    sender: "director@company.com"
    recipient: "user@company.com"
    subject: "Квартальный отчёт"
    body: |
      Добрый день! Напоминаю, что квартальный отчёт необходимо сдать до 15 марта.
      Выручка за квартал составила 2.5 млн рублей. Прошу подготовить презентацию
      для совета директоров на 20 марта.
    delay: 0

  - id: "mail02"
    sender: "hr@company.com"
    recipient: "user@company.com"
    subject: "Новая политика отпусков"
    body: |
      Уважаемые коллеги! С 1 апреля вводится новая политика отпусков.
      Теперь каждый сотрудник имеет право на 28 календарных дней отпуска в год.
      Заявление нужно подать не менее чем за 14 дней. По вопросам обращайтесь к Ивановой М.А.
    delay: 0

  - id: "mail03"
    sender: "ivanov@company.com"
    recipient: "user@company.com"
    subject: "Встреча по проекту Альфа"
    body: |
      Привет! Встреча по проекту Альфа перенесена на среду 12 марта в 15:00.
      Конференц-зал B3, 4 этаж. Повестка: статус спринта, блокеры, планы на след. неделю.
      Бюджет проекта — 800 тыс. рублей.
    delay: 1

  - id: "mail04"
    sender: "director@company.com"
    recipient: "user@company.com"
    subject: "Re: Квартальный отчёт"
    reply_to: "mail01"
    body: |
      Дополнение: также включите в отчёт показатель удовлетворённости клиентов.
      Целевое значение — 92%. По данным за квартал мы достигли 89%.
      Нужно подготовить план улучшений.
    delay: 1

  - id: "mail05"
    sender: "security@company.com"
    recipient: "user@company.com"
    subject: "Смена пароля"
    body: |
      Ваш корпоративный пароль истекает через 7 дней.
      Пожалуйста, смените пароль в личном кабинете до 18 марта.
      Минимальная длина пароля — 12 символов.
    delay: 1

questions:
  - question: "Какая выручка была за квартал?"
    expected_answer: "2.5 млн рублей"
    ask_after: 5

  - question: "Сколько дней отпуска полагается сотруднику по новой политике?"
    expected_answer: "28 календарных дней"
    ask_after: 2

  - question: "Когда и где состоится встреча по проекту Альфа?"
    expected_answer: "среда 12 марта в 15:00, конференц-зал B3, 4 этаж"
    ask_after: 1

  - question: "Какой фактический показатель удовлетворённости клиентов за квартал?"
    expected_answer: "89%"
    ask_after: 2

  - question: "До какого числа нужно сменить корпоративный пароль?"
    expected_answer: "18 марта"
    ask_after: 1